name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write          # needed for creating releases

jobs:
  # ─────────────────────────────────────────────
  #  Windows Build
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package Windows release
        shell: pwsh
        run: |
          # Create the package directory
          New-Item -ItemType Directory -Force -Path "package/GameOfLife-Windows"

          # Copy the executable (MSVC puts it under Release/)
          Copy-Item "build/Release/GameOfLife.exe" "package/GameOfLife-Windows/" -ErrorAction SilentlyContinue
          # Fallback: if the exe is not under Release/ (depends on generator)
          if (-not (Test-Path "package/GameOfLife-Windows/GameOfLife.exe")) {
            $exe = Get-ChildItem -Path "build" -Filter "GameOfLife.exe" -Recurse | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName "package/GameOfLife-Windows/" }
          }

          # Copy all DLLs from the build tree (SFML, OpenAL, etc.)
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "package/GameOfLife-Windows/" -ErrorAction SilentlyContinue
          }

          # Copy assets
          if (Test-Path "assets") {
            Copy-Item -Recurse "assets" "package/GameOfLife-Windows/assets"
          }

          # Add a simple launcher README
          @"
          ===================================
            Conway's Game of Life
          ===================================

          Double-click GameOfLife.exe to play!

          Controls:
            Space         - Play / Pause
            Right Arrow   - Step one generation
            Left Drag     - Draw cells
            Right Drag    - Erase cells
            Middle Drag   - Pan camera
            Scroll Wheel  - Zoom
            1-4           - Place patterns
            C             - Clear grid
            R             - Randomize
            G             - Toggle grid lines
            S             - Save to save.json
            L             - Load from save.json
          "@ | Out-File "package/GameOfLife-Windows/README.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Windows
          path: package/GameOfLife-Windows/

  # ─────────────────────────────────────────────
  #  Linux Build
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev \
            libxi-dev libudev-dev libgl1-mesa-dev \
            libfreetype-dev libopenal-dev libvorbis-dev \
            libflac-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Package Linux release
        run: |
          mkdir -p package/GameOfLife-Linux
          cp build/GameOfLife package/GameOfLife-Linux/
          cp -r assets package/GameOfLife-Linux/ 2>/dev/null || true

          cat > package/GameOfLife-Linux/README.txt << 'EOF'
          ===================================
            Conway's Game of Life
          ===================================

          To run:
            chmod +x GameOfLife
            ./GameOfLife

          You may need to install SFML runtime libraries:
            Ubuntu/Debian: sudo apt install libsfml-graphics2.6 libsfml-window2.6 libsfml-system2.6
            Fedora:        sudo dnf install SFML
            Arch:          sudo pacman -S sfml

          Controls:
            Space         - Play / Pause
            Right Arrow   - Step one generation
            Left Drag     - Draw cells
            Right Drag    - Erase cells
            Middle Drag   - Pan camera
            Scroll Wheel  - Zoom
            1-4           - Place patterns
            C             - Clear grid
            R             - Randomize
            G             - Toggle grid lines
            S             - Save to save.json
            L             - Load from save.json
          EOF

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Linux
          path: package/GameOfLife-Linux/

  # ─────────────────────────────────────────────
  #  Create GitHub Release (on version tags only)
  # ─────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Zip platform packages
        run: |
          cd artifacts
          zip -r ../GameOfLife-Windows.zip GameOfLife-Windows/
          tar czf ../GameOfLife-Linux.tar.gz GameOfLife-Linux/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GameOfLife-Windows.zip
            GameOfLife-Linux.tar.gz
