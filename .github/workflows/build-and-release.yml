name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
build-windows:
  name: Build Windows
  runs-on: windows-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Debug CMake environment
      shell: pwsh
      run: |
        Write-Host "CMAKE_POLICY_VERSION_MINIMUM = [$env:CMAKE_POLICY_VERSION_MINIMUM]"
        Write-Host "CMake version:"
        cmake --version
        Write-Host "Workflow files:"
        Get-ChildItem -Path .github/workflows -Recurse
        Write-Host "Searching workflow files:"
        Get-ChildItem -Path .github/workflows -Recurse -File | Select-String "CMAKE_POLICY_VERSION_MINIMUM"

    - name: Configure CMake
      shell: pwsh
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      run: |
        Write-Host "Using CMAKE_POLICY_VERSION_MINIMUM = [$env:CMAKE_POLICY_VERSION_MINIMUM]"
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Package Windows
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        Copy-Item "build/Release/GameOfLife.exe" "artifacts/GameOfLife-Windows.exe"

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameOfLife-Windows
        path: artifacts/GameOfLife-Windows.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libopenal-dev \
            libflac-dev \
            libvorbis-dev \
            libgl1-mesa-dev \
            libfreetype6-dev

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux
        run: |
          mkdir -p artifacts
          cp build/GameOfLife artifacts/GameOfLife-Linux
          chmod +x artifacts/GameOfLife-Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Linux
          path: artifacts/GameOfLife-Linux


  release:
    name: Create Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: GameOfLife-Windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: GameOfLife-Linux
          path: release

      - name: Create ZIP files
        run: |
          cd release

          zip GameOfLife-Windows.zip GameOfLife-Windows.exe
          zip GameOfLife-Linux.zip GameOfLife-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/GameOfLife-Windows.zip
            release/GameOfLife-Linux.zip