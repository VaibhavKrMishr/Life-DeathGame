name: Test Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        run: |
          curl -L \
            "https://github.com/${{ github.repository }}/archive/refs/heads/main.zip" \
            -o source.zip

          unzip source.zip

          echo "Repository downloaded successfully"
          find . -maxdepth 2 -type f | head -50

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Test CMake
        run: |
          DIR=$(find . -maxdepth 1 -type d -name "*Life-DeathGame" | head -1)
          echo "Source directory: $DIR"

          cd "$DIR"

          cmake -S . -B build