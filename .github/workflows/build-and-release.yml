name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS
  # ==========================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        shell: powershell
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Find executable
        shell: powershell
        run: |
          Write-Host "Searching for GameOfLife.exe..."
          Get-ChildItem -Path build -Filter GameOfLife.exe -Recurse

      - name: Package Windows
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package/GameOfLife-Windows

          $exe = Get-ChildItem `
            -Path build `
            -Filter GameOfLife.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "GameOfLife.exe was not found!"
            exit 1
          }

          Copy-Item $exe.FullName package/GameOfLife-Windows/

          if (Test-Path assets) {
            Copy-Item -Recurse assets package/GameOfLife-Windows/
          }

          @"
          Conway's Game of Life
          =====================

          Run GameOfLife.exe

          Controls:
            Space       Play / Pause
            Right Arrow Step
            Left Drag   Draw
            Right Drag  Erase
            Middle Drag Pan
            Wheel       Zoom
            C           Clear
            R           Randomize
            G           Grid
            S           Save
            L           Load
          "@ | Out-File package/GameOfLife-Windows/README.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Windows
          path: package/GameOfLife-Windows


  # ==========================================
  # LINUX
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libgl1-mesa-dev \
            libfreetype-dev \
            libopenal-dev \
            libvorbis-dev \
            libflac-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux
        run: |
          mkdir -p package/GameOfLife-Linux

          if [ ! -f build/GameOfLife ]; then
            echo "GameOfLife executable not found"
            find build -type f
            exit 1
          fi

          cp build/GameOfLife package/GameOfLife-Linux/

          if [ -d assets ]; then
            cp -r assets package/GameOfLife-Linux/
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Linux
          path: package/GameOfLife-Linux


  # ==========================================
  # RELEASE
  # ==========================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: GameOfLife-Windows
          path: windows

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: GameOfLife-Linux
          path: linux

      - name: Create packages
        run: |
          cd windows
          zip -r ../GameOfLife-Windows.zip .

          cd ../linux
          tar -czf ../GameOfLife-Linux.tar.gz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GameOfLife-Windows.zip
            GameOfLife-Linux.tar.gz