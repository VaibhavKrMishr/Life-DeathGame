name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/GameOfLife-Windows

          $exe = Get-ChildItem build -Filter GameOfLife.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "GameOfLife.exe not found!"
            exit 1
          }

          Copy-Item $exe.FullName package/GameOfLife-Windows/

          if (Test-Path assets) {
            Copy-Item -Recurse assets package/GameOfLife-Windows/
          }

          Get-ChildItem build -Filter "*.dll" -Recurse |
            ForEach-Object {
              Copy-Item $_.FullName package/GameOfLife-Windows/ -Force
            }

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Windows
          path: package/GameOfLife-Windows/


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libgl1-mesa-dev \
            libfreetype-dev \
            libopenal-dev \
            libvorbis-dev \
            libflac-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux
        run: |
          mkdir -p package/GameOfLife-Linux

          cp build/GameOfLife package/GameOfLife-Linux/

          if [ -d assets ]; then
            cp -r assets package/GameOfLife-Linux/
          fi

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: GameOfLife-Linux
          path: package/GameOfLife-Linux/


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: GameOfLife-Windows
          path: windows

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: GameOfLife-Linux
          path: linux

      - name: Create packages
        run: |
          cd windows
          zip -r ../GameOfLife-Windows.zip .

          cd ../linux
          tar -czf ../GameOfLife-Linux.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GameOfLife-Windows.zip
            GameOfLife-Linux.tar.gz